<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Emberlight — Keeper of the Last Lantern. A top-down arena shooter: survive 10 waves of shades, choose blessings between waves, and slay the Gloom Herald.">
<link rel="icon" href="data:,">
<title>Emberlight — Keeper of the Last Lantern</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberlight: Wren, keeper of the last lantern, fights waves of shades. Move with W A S D, aim with the mouse, hold click to fire."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
